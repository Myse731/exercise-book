const TILE = 32;

// ===================== 알고리즘으로 미로 생성 (재귀적 백트래킹) =====================
// 홀수 크기 격자에서 셀 단위로 미로를 생성 -> 벽 뚫기 방식이라 100% 연결이 보장됨
function generateMaze(cellRows, cellCols) {
  // 전체 격자 크기는 (cellRows*2+1) x (cellCols*2+1)
  const rows = cellRows * 2 + 1;
  const cols = cellCols * 2 + 1;
  const grid = Array.from({length: rows}, () => Array(cols).fill(1)); // 1 = 벽

  const visited = Array.from({length: cellRows}, () => Array(cellCols).fill(false));

  function carve(cr, cc) {
    visited[cr][cc] = true;
    grid[cr*2+1][cc*2+1] = 0; // 셀 중심을 통로로

    const dirs = shuffleArray([
      {dr:-1, dc:0}, {dr:1, dc:0}, {dr:0, dc:-1}, {dr:0, dc:1}
    ]);

    for (const d of dirs) {
      const nr = cr + d.dr;
      const nc = cc + d.dc;
      if (nr >= 0 && nr < cellRows && nc >= 0 && nc < cellCols && !visited[nr][nc]) {
        // 현재 셀과 다음 셀 사이의 벽 뚫기
        grid[cr*2+1 + d.dr][cc*2+1 + d.dc] = 0;
        carve(nr, nc);
      }
    }
  }

  carve(0, 0);

  // 미로가 너무 일자로만 뻗지 않도록, 추가로 몇 개의 벽을 더 뚫어서 순환 경로(루프)를 만듦
  // 이렇게 하면 유령을 피해 돌아갈 수 있는 여러 경로가 생김
  const extraLoops = Math.floor(cellRows * cellCols * 0.15);
  for (let i = 0; i < extraLoops; i++) {
    const r = 1 + Math.floor(Math.random() * (rows - 2));
    const c = 1 + Math.floor(Math.random() * (cols - 2));
    if (grid[r][c] === 1) {
      // 이 벽을 뚫었을 때 상하 또는 좌우가 모두 통로인 경우에만 뚫어서 루프 생성
      const up = grid[r-1] ? grid[r-1][c] : 1;
      const down = grid[r+1] ? grid[r+1][c] : 1;
      const left = grid[r][c-1];
      const right = grid[r][c+1];
      if ((up === 0 && down === 0) || (left === 0 && right === 0)) {
        grid[r][c] = 0;
      }
    }
  }

  // 바깥 테두리는 항상 벽으로 고정
  for (let c = 0; c < cols; c++) { grid[0][c] = 1; grid[rows-1][c] = 1; }
  for (let r = 0; r < rows; r++) { grid[r][0] = 1; grid[r][cols-1] = 1; }

  return grid.map(row => row.join(''));
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===================== BFS 연결성 검증 =====================
function verifyMazeConnectivity(mazeArr) {
  const rows = mazeArr.length;
  const cols = mazeArr[0].length;
  let startR = -1, startC = -1;
  let totalOpen = 0;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (mazeArr[r][c] === '0') {
        totalOpen++;
        if (startR === -1) { startR = r; startC = c; }
      }
    }
  }

  if (startR === -1) return { connected: true, total: 0, reached: 0 };

  const visited = Array.from({length: rows}, () => Array(cols).fill(false));
  const queue = [[startR, startC]];
  visited[startR][startC] = true;
  let reached = 1;

  while (queue.length > 0) {
    const [r, c] = queue.shift();
    const neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
    for (const [nr, nc] of neighbors) {
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols &&
          !visited[nr][nc] && mazeArr[nr][nc] === '0') {
        visited[nr][nc] = true;
        reached++;
        queue.push([nr, nc]);
      }
    }
  }

  return { connected: reached === totalOpen, total: totalOpen, reached: reached };
}

// 연결성이 보장될 때까지 미로를 재생성 (알고리즘 특성상 사실상 항상 1번에 성공함)
function generateVerifiedMaze(cellRows, cellCols) {
  let attempts = 0;
  while (attempts < 10) {
    const maze = generateMaze(cellRows, cellCols);
    const result = verifyMazeConnectivity(maze);
    if (result.connected) {
      console.log(`[맵 생성 성공] ${cellRows}x${cellCols} 셀 크기 -> 전체 ${result.total}칸 모두 연결 확인 완료 (시도 ${attempts+1}회)`);
      return maze;
    }
    attempts++;
  }
  console.warn('맵 생성 실패, 기본 맵 사용');
  return generateMaze(cellRows, cellCols); // 최후의 수단
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTone(freq, duration, type='sine', vol=0.08, startDelay=0) {
  if (!audioCtx || !bgmEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = vol;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime + startDelay;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.start(t);
  osc.stop(t + duration);
}

const melodyNotes = [220, 261.63, 293.66, 329.63, 392, 329.63, 293.66, 261.63];
const bassNotes = [110, 110, 130.81, 130.81, 98, 98, 110, 110];

function startBGM() {
  if (bgmInterval) return;
  bgmStep = 0;
  bgmInterval = setInterval(() => {
    if (!bgmEnabled || !gameRunning) return;
    const note = melodyNotes[bgmStep % melodyNotes.length];
    const bass = bassNotes[bgmStep % bassNotes.length];
    playTone(note, 0.35, 'triangle', 0.06);
    if (bgmStep % 2 === 0) playTone(bass, 0.5, 'sine', 0.05);
    bgmStep++;
  }, 380);
}

function stopBGM() {
  if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
}

function playEatSound() { playTone(880, 0.08, 'square', 0.05); }
function playCaptureSound() {
  playTone(200, 0.5, 'sawtooth', 0.15);
  playTone(150, 0.6, 'sawtooth', 0.12, 0.1);
}
function playStageClearSound() {
  playTone(523, 0.15, 'sine', 0.1, 0);
  playTone(659, 0.15, 'sine', 0.1, 0.15);
  playTone(784, 0.3, 'sine', 0.1, 0.3);
}

document.getElementById('soundToggle').addEventListener('click', () => {
  bgmEnabled = !bgmEnabled;
  document.getElementById('soundToggle').textContent = bgmEnabled ? '🔊 배경음악 끄기' : '🔇 배경음악 켜기';
  if (!bgmEnabled) stopBGM(); else startBGM();
});

// ===================== 퀴즈 유틸 =====================
function pickRandomQuiz(stage) {
  const quizList = stage.quizzes;
  const original = quizList[Math.floor(Math.random() * quizList.length)];
  const correctText = original.options[original.answer];
  const shuffledOptions = shuffleArray(original.options);
  const newAnswerIndex = shuffledOptions.indexOf(correctText);
  return { q: original.q, options: shuffledOptions, answer: newAnswerIndex };
}

// ===================== 초기화 =====================
function loadMaze(mazeTemplate) {
  ROWS = mazeTemplate.length;
  COLS = mazeTemplate[0].length;
  maze = [];
  dots = [];
  for (let r = 0; r < ROWS; r++) {
    let row = [];
    for (let c = 0; c < COLS; c++) {
      let ch = mazeTemplate[r][c];
      if (ch === '1') { row.push(1); }
      else { row.push(0); dots.push({x:c, y:r, eaten:false}); }
    }
    maze.push(row);
  }
}

function findOpenSpot(excludeList) {
  const openSpots = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (maze[r][c] === 0) {
        const clash = excludeList.some(e => e.x === c && e.y === r);
        if (!clash) openSpots.push({x:c, y:r});
      }
    }
  }
  openSpots.sort((a,b) => {
    const da = Math.abs(a.x-1)+Math.abs(a.y-1);
    const db = Math.abs(b.x-1)+Math.abs(b.y-1);
    return db - da;
  });
  return openSpots[0] || {x:1, y:1};
}

function resetPlayerAndGhosts(ghostCount) {
  // 플레이어 시작 위치는 항상 통로인 (1,1)로 설정 (미로 생성 알고리즘 특성상 항상 통로)
  player.x = 1; player.y = 1;
  player.fromX = 1; player.fromY = 1;
  player.toX = 1; player.toY = 1;
  player.progress = 1;
  player.dir = {x:0,y:0};
  player.nextDir = {x:0,y:0};

  const ghostColors = ['#ff5555', '#55aaff', '#aa55ff'];
  const ghostNames = ['중력', '복사압', '불안정'];

  ghosts = [];
  const placed = [{x:1, y:1}];

  for (let i = 0; i < ghostCount; i++) {
    const spot = findOpenSpot(placed);
    placed.push(spot);
    ghosts.push({
      x: spot.x, y: spot.y,
      fromX: spot.x, fromY: spot.y,
      toX: spot.x, toY: spot.y,
      progress: 1,
      color: ghostColors[i % ghostColors.length],
      name: ghostNames[i % ghostNames.length],
      dir: {x: (i % 2 === 0 ? 1 : -1), y: 0},
      frameDiv: GHOST_MOVE_FRAMES_BASE + i*2
    });
  }
}

function stageDifficultyFactor(index) {
  return Math.max(6, GHOST_MOVE_FRAMES_BASE - index * 1);
}

function startStage(index) {
  stageIndex = index;
  temperature = 0;
  const config = stageConfig[index];

  const newMaze = generateVerifiedMaze(config.cellSize, config.cellSize);
  loadMaze(newMaze);
  setupCanvasSize();
  resetPlayerAndGhosts(config.ghostCount);

  const diff = stageDifficultyFactor(index);
  ghosts.forEach((g, i) => { g.frameDiv = diff + i*2; });

  updateHUD();
  document.getElementById('stageInfo').textContent =
    `${STAGES[index].name} 단계 - ${STAGES[index].dotName}(${STAGES[index].dotElement}) 원소를 ${Math.round(CLEAR_RATIO*100)}% 모으면 다음 단계로!`;
  document.getElementById('ghostCountInfo').textContent =
    `👻 현재 유령(불안정 요인) 개수: ${config.ghostCount}개`;

  if (index === STAGES.length - 1) {
    let emptyTiles = dots.filter(d => !d.eaten);
    powerUpPos = emptyTiles[Math.floor(emptyTiles.length/2)];
    powerUpPos.eaten = false;
  } else {
    powerUpPos = null;
  }
}

function updateHUD() {
  document.getElementById('lives').textContent = lives;
  document.getElementById('score').textContent = score;
  document.getElementById('stageNum').textContent = stageIndex + 1;
  const totalDots = dots.length;
  const eatenDots = dots.filter(d => d.eaten).length;
  const pct = totalDots > 0 ? Math.min(100, (eatenDots/totalDots)*100) : 0;
  temperature = pct;
  document.getElementById('tempBar').style.width = pct + '%';
  document.getElementById('tempLabel').textContent = STAGES[stageIndex].tempLabel;

  let dexHTML = collectedElements.map(e => `<span class="dexBadge">${e}</span>`).join('');
  document.getElementById('dexList').innerHTML = dexHTML || '없음';
}

  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('popupTitle').textContent = `🔥 ${stage.name} 단계 돌입!`;
  document.getElementById('popupText').textContent = stage.story;

  const btn = document.getElementById('popupBtn');
  btn.style.display = 'block';
  btn.textContent = '확인 (퀴즈 풀기)';
  btn.onclick = () => {
    currentQuiz = pickRandomQuiz(stage);
    showQuiz(currentQuiz, callback);
  };
}

function showQuiz(quiz, callback) {
  document.getElementById('popupTitle').textContent = "🧠 미니 퀴즈";
  document.getElementById('popupText').textContent = quiz.q;
  const quizDiv = document.getElementById('quizOptions');
  quizDiv.innerHTML = '';
  document.getElementById('popupBtn').style.display = 'none';

  quiz.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.textContent = opt;
    b.onclick = () => {
      if (i === quiz.answer) {
        score += QUIZ_CORRECT_BONUS;
        document.getElementById('popupTitle').textContent = "✅ 정답입니다!";
        document.getElementById('popupText').textContent = `보너스 ${QUIZ_CORRECT_BONUS}점 획득! 다음 단계로 이동합니다.`;
      } else {
        document.getElementById('popupTitle').textContent = "❌ 오답입니다";
        document.getElementById('popupText').textContent = `정답은 "${quiz.options[quiz.answer]}" 였습니다. 다음 단계로 이동합니다.`;
      }
      quizDiv.innerHTML = '';
      const finalBtn = document.getElementById('popupBtn');
      finalBtn.style.display = 'block';
      finalBtn.textContent = '계속하기';
      finalBtn.onclick = () => {
        document.getElementById('overlay').style.display = 'none';
        callback();
      };
    };
    quizDiv.appendChild(b);
  });
}

// ===================== 입력 처리 =====================
document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  if (e.key === 'ArrowUp') { player.nextDir = {x:0, y:-1}; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { player.nextDir = {x:0, y:1}; e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { player.nextDir = {x:-1, y:0}; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { player.nextDir = {x:1, y:0}; e.preventDefault(); }
});

document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  document.getElementById('startBtn').style.display = 'none';
  resetGame();
});

function resetGame() {
  score = 0;
  lives = 3;
  collectedElements = [];
  startStage(0);
  showStagePopup(STAGES[0], () => {
    gameRunning = true;
    lastTime = performance.now();
    startBGM();
    requestAnimationFrame(gameLoop);
  });
}

// ===================== 격자 이동 헬퍼 =====================
function tryStartMove(entity, dir, frames) {
  if (dir.x === 0 && dir.y === 0) return false;
  let nx = entity.x + dir.x;
  let ny = entity.y + dir.y;

  if (nx < 0) nx = COLS - 1;
  if (nx >= COLS) nx = 0;

  if (ny < 0 || ny >= ROWS) return false;
  if (maze[ny][nx] === 1) return false;

  entity.fromX = entity.x;
  entity.fromY = entity.y;
  entity.toX = nx;
  entity.toY = ny;
  entity.progress = 0;
  entity.dir = dir;
  return true;
}

function stepEntity(entity, frames) {
  if (entity.progress < 1) {
    entity.progress += 1/frames;
    if (entity.progress >= 1) {
      entity.progress = 1;
      entity.x = entity.toX;
      entity.y = entity.toY;
    }
  }
}

function getPixelPos(entity) {
  const x = entity.fromX + (entity.toX - entity.fromX) * entity.progress;
  const y = entity.fromY + (entity.toY - entity.fromY) * entity.progress;
  return { px: x*TILE, py: y*TILE };
}

// ===================== 게임 루프 =====================
let lastTime = 0;
function gameLoop(timestamp) {
  if (!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function update() {
  if (player.progress >= 1) {
    let moved = false;
    if (player.nextDir.x !== 0 || player.nextDir.y !== 0) {
      moved = tryStartMove(player, player.nextDir, PLAYER_MOVE_FRAMES);
    }
    if (!moved) {
      tryStartMove(player, player.dir, PLAYER_MOVE_FRAMES);
    }
  }
  stepEntity(player, PLAYER_MOVE_FRAMES);
  player.mouth += 0.2;

  const checkX = player.progress >= 1 ? player.x : (player.progress > 0.5 ? player.toX : player.fromX);
  const checkY = player.progress >= 1 ? player.y : (player.progress > 0.5 ? player.toY : player.fromY);

  dots.forEach(d => {
    if (!d.eaten && d.x === checkX && d.y === checkY) {
      d.eaten = true;
      score += DOT_SCORE;
      playEatSound();
      const stage = STAGES[stageIndex];
      if (!collectedElements.includes(stage.dotElement)) {
        collectedElements.push(stage.dotElement);
      }
      updateHUD();
    }
  });

  if (powerUpPos && !powerUpPos.eaten && powerUpPos.x === checkX && powerUpPos.y === checkY) {
    powerUpPos.eaten = true;
    invincible = true;
    invincibleTimer = 300;
    score += POWERUP_SCORE;
    updateHUD();
  }

  if (invincible) {
    invincibleTimer--;
    if (invincibleTimer <= 0) invincible = false;
  }

  const totalDots = dots.length;
  const eatenDots = dots.filter(d => d.eaten).length;
  const clearThreshold = Math.ceil(totalDots * CLEAR_RATIO);

  if (eatenDots >= clearThreshold && gameRunning) {
    gameRunning = false;
    score += STAGE_CLEAR_BONUS;
    playStageClearSound();
    if (stageIndex < STAGES.length - 1) {
      setTimeout(() => {
        showStagePopup(STAGES[stageIndex+1], () => {
          startStage(stageIndex+1);
          gameRunning = true;
          lastTime = performance.now();
          requestAnimationFrame(gameLoop);
        });
      }, 300);
    } else {
      setTimeout(showEnding, 300);
    }
    return;
  }

  // 유령 이동
  ghosts.forEach(g => {
    if (g.progress >= 1) {
      const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      let valid = dirs.filter(d => {
        let nx = g.x + d.x;
        let ny = g.y + d.y;
        if (nx < 0) nx = COLS - 1;
        if (nx >= COLS) nx = 0;
        if (ny < 0 || ny >= ROWS) return false;
        return maze[ny][nx] !== 1;
      });

      let nonReverse = valid.filter(d => !(d.x === -g.dir.x && d.y === -g.dir.y));
      let candidates = nonReverse.length > 0 ? nonReverse : valid;

      if (candidates.length > 0) {
        let chosen;
        if (Math.random() < 0.5) {
          let minDist = Infinity;
          candidates.forEach(d => {
            const nx = g.x + d.x, ny = g.y + d.y;
            const dist = Math.abs(nx - player.x) + Math.abs(ny - player.y);
            if (dist < minDist) { minDist = dist; chosen = d; }
          });
        } else {
          chosen = candidates[Math.floor(Math.random()*candidates.length)];
        }
        tryStartMove(g, chosen, g.frameDiv);
      }
    }
    stepEntity(g, g.frameDiv);
  });

  // 충돌 체크
  if (!invincible) {
    const pPos = getPixelPos(player);
    for (let g of ghosts) {
      const gPos = getPixelPos(g);
      const dx = Math.abs(gPos.px - pPos.px);
      const dy = Math.abs(gPos.py - pPos.py);
      if (dx < TILE*0.6 && dy < TILE*0.6) {
        lives--;
        updateHUD();
        if (lives <= 0) {
          gameRunning = false;
          setTimeout(showGameOver, 100);
        } else {
          gameRunning = false;
          setTimeout(() => {
            showLifeLostPopup(() => {
              const config = stageConfig[stageIndex];
              resetPlayerAndGhosts(config.ghostCount);
              const diff = stageDifficultyFactor(stageIndex);
              ghosts.forEach((g, i) => { g.frameDiv = diff + i*2; });
              gameRunning = true;
              lastTime = performance.now();
              requestAnimationFrame(gameLoop);
            });
          }, 100);
        }
        return;
      }
    }
  }
}

// ===================== 그리기 =====================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (maze[r][c] === 1) {
        ctx.fillStyle = '#1a1a4a';
        ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
        ctx.strokeStyle = '#3355aa';
        ctx.strokeRect(c*TILE, r*TILE, TILE, TILE);
      }
    }
  }

  const stage = STAGES[stageIndex];

  dots.forEach(d => {
    if (!d.eaten) {
      ctx.beginPath();
      ctx.fillStyle = stage.dotColor;
      ctx.arc(d.x*TILE + TILE/2, d.y*TILE + TILE/2, 5, 0, Math.PI*2);
      ctx.fill();
    }
  });

  if (powerUpPos && !powerUpPos.eaten) {
    ctx.beginPath();
    ctx.fillStyle = '#ff00ff';
    const pulse = 8 + Math.sin(Date.now()/150)*3;
    ctx.arc(powerUpPos.x*TILE + TILE/2, powerUpPos.y*TILE + TILE/2, pulse, 0, Math.PI*2);
    ctx.fill();
  }

  const pPos = getPixelPos(player);
  ctx.save();
  ctx.translate(pPos.px + TILE/2, pPos.py + TILE/2);
  let angle = 0;
  if (player.dir.x === 1) angle = 0;
  else if (player.dir.x === -1) angle = Math.PI;
  else if (player.dir.y === -1) angle = -Math.PI/2;
  else if (player.dir.y === 1) angle = Math.PI/2;
  ctx.rotate(angle);

  const mouthOpen = Math.abs(Math.sin(player.mouth)) * 0.3 + 0.05;
  ctx.beginPath();
  ctx.fillStyle = invincible ? '#00ffff' : '#ffdd00';
  ctx.arc(0, 0, TILE/2 - 1, mouthOpen*Math.PI, (2-mouthOpen)*Math.PI);
  ctx.lineTo(0,0);
  ctx.fill();
  ctx.restore();

  ghosts.forEach(g => {
    const gPos = getPixelPos(g);
    ctx.fillStyle = invincible ? '#3333ff' : g.color;
    ctx.beginPath();
    ctx.arc(gPos.px + TILE/2, gPos.py + TILE/2 - 2, TILE/2 - 2, Math.PI, 0);
    ctx.lineTo(gPos.px + TILE - 2, gPos.py + TILE - 2);
    for (let i = 0; i < 3; i++) {
      ctx.lineTo(gPos.px + TILE - 2 - (i+0.5)*(TILE-4)/3, gPos.py + TILE - 6);
      ctx.lineTo(gPos.px + TILE - 2 - (i+1)*(TILE-4)/3, gPos.py + TILE - 2);
    }
    ctx.lineTo(gPos.px + 2, gPos.py + TILE/2 - 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(gPos.px+TILE/2-4, gPos.py+TILE/2-4, 3, 0, Math.PI*2);
    ctx.arc(gPos.px+TILE/2+4, gPos.py+TILE/2-4, 3, 0, Math.PI*2);
    ctx.fill();
  });
}

// ===================== 초기 셋업 =====================
const initialMaze = generateVerifiedMaze(6, 6);
loadMaze(initialMaze);
setupCanvasSize();
resetPlayerAndGhosts(1);
draw();
</script>
