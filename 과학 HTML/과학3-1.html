const TILE = 28;
// ===================== 미로 생성: 루프 비율 대폭 증가 =====================
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function generateMaze(cellRows, cellCols) {
  const rows = cellRows*2+1;
  const cols = cellCols*2+1;
  const grid = Array.from({length:rows}, ()=>Array(cols).fill(1));
  const visited = Array.from({length:cellRows}, ()=>Array(cellCols).fill(false));
  // 재귀적 백트래킹으로 스패닝 트리 생성
  function carve(cr, cc) {
    visited[cr][cc] = true;
    grid[cr*2+1][cc*2+1] = 0;
    const dirs = shuffleArray([{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}]);
    for (const d of dirs) {
      const nr=cr+d.dr, nc=cc+d.dc;
      if (nr>=0&&nr<cellRows&&nc>=0&&nc<cellCols&&!visited[nr][nc]) {
        grid[cr*2+1+d.dr][cc*2+1+d.dc]=0;
        carve(nr,nc);
      }
    }
  }
  carve(0,0);
  // ── 루프(순환 경로) 대폭 추가 ──
  // 0.15 → 0.45: 기존 대비 3배, 벽 제거 조건도 완화 (인접 통로 2개 이상이면 뚫음)
  const targetLoops = Math.floor(cellRows * cellCols * 0.45);
  let added = 0, tries = 0;
  while (added < targetLoops && tries < targetLoops * 10) {
    tries++;
    const r = 1 + Math.floor(Math.random()*(rows-2));
    const c = 1 + Math.floor(Math.random()*(cols-2));
    if (grid[r][c] !== 1) continue;
    const adj = [
      r>0      ? grid[r-1][c] : 1,
      r<rows-1 ? grid[r+1][c] : 1,
      c>0      ? grid[r][c-1] : 1,
      c<cols-1 ? grid[r][c+1] : 1
    ];
    // 주변에 통로가 2개 이상이면 이 벽을 뚫어 교차로/T자로 생성
    if (adj.filter(v=>v===0).length >= 2) {
      grid[r][c] = 0;
      added++;
    }
  }
  // 테두리는 항상 벽
  for (let c=0;c<cols;c++){grid[0][c]=1;grid[rows-1][c]=1;}
  for (let r=0;r<rows;r++){grid[r][0]=1;grid[r][cols-1]=1;}
  return grid.map(row=>row.join(''));
}
function verifyMazeConnectivity(mazeArr) {
  const rows=mazeArr.length, cols=mazeArr[0].length;
  let startR=-1, startC=-1, totalOpen=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
    if(mazeArr[r][c]==='0'){totalOpen++;if(startR===-1){startR=r;startC=c;}}
  }
  if(startR===-1) return {connected:true,total:0,reached:0};
  const vis=Array.from({length:rows},()=>Array(cols).fill(false));
  const q=[[startR,startC]]; vis[startR][startC]=true; let reached=1;
  while(q.length){
    const[r,c]=q.shift();
    for(const[nr,nc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]) {
      if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&!vis[nr][nc]&&mazeArr[nr][nc]==='0'){
        vis[nr][nc]=true;reached++;q.push([nr,nc]);
      }
    }
  }
  return {connected:reached===totalOpen,total:totalOpen,reached};
}
function generateVerifiedMaze(cellRows, cellCols) {
  for(let i=0;i<10;i++){
    const m=generateMaze(cellRows,cellCols);
    const r=verifyMazeConnectivity(m);
    if(r.connected){console.log(`맵생성성공 ${cellRows}x${cellCols} ${r.total}칸 시도${i+1}회`);return m;}
  }
  return generateMaze(cellRows,cellCols);
}

let audioCtx=null, bgmEnabled=true, bgmInterval=null, bgmStep=0;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,duration,type='sine',vol=0.08,delay=0){
  if(!audioCtx||!bgmEnabled)return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type=type; osc.frequency.value=freq; gain.gain.value=vol;
  osc.connect(gain); gain.connect(audioCtx.destination);
  const t=audioCtx.currentTime+delay;
  gain.gain.setValueAtTime(vol,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
  osc.start(t); osc.stop(t+duration);
}
const melodyNotes=[220,261.63,293.66,329.63,392,329.63,293.66,261.63];
const bassNotes=[110,110,130.81,130.81,98,98,110,110];
function startBGM(){
  if(bgmInterval)return; bgmStep=0;
  bgmInterval=setInterval(()=>{
    if(!bgmEnabled||!gameRunning)return;
    playTone(melodyNotes[bgmStep%8],0.35,'triangle',0.06);
    if(bgmStep%2===0)playTone(bassNotes[bgmStep%8],0.5,'sine',0.05);
    bgmStep++;
  },380);
}
function stopBGM(){if(bgmInterval){clearInterval(bgmInterval);bgmInterval=null;}}
function playEatSound(){playTone(880,0.08,'square',0.05);}
function playCaptureSound(){playTone(200,0.5,'sawtooth',0.15);playTone(150,0.6,'sawtooth',0.12,0.1);}
function playStageClearSound(){playTone(523,0.15,'sine',0.1,0);playTone(659,0.15,'sine',0.1,0.15);playTone(784,0.3,'sine',0.1,0.3);}

function pickRandomQuiz(stage){
  const orig=stage.quizzes[Math.floor(Math.random()*stage.quizzes.length)];
  const correct=orig.options[orig.answer];
  const opts=shuffleArray(orig.options);
  return{q:orig.q,options:opts,answer:opts.indexOf(correct)};
}
function loadMaze(tmpl){
  ROWS=tmpl.length; COLS=tmpl[0].length;
  maze=[]; dots=[];
  for(let r=0;r<ROWS;r++){
    let row=[];
    for(let c=0;c<COLS;c++){
      if(tmpl[r][c]==='1')row.push(1);
      else{row.push(0);dots.push({x:c,y:r,eaten:false});}
    }
    maze.push(row);
  }
}
function findOpenSpot(excl){
  let spots=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
    if(maze[r][c]===0&&!excl.some(e=>e.x===c&&e.y===r))spots.push({x:c,y:r});
  spots.sort((a,b)=>(Math.abs(b.x-1)+Math.abs(b.y-1))-(Math.abs(a.x-1)+Math.abs(a.y-1)));
  return spots[0]||{x:1,y:1};
}
function resetPlayerAndGhosts(ghostCount){
  Object.assign(player,{x:1,y:1,fromX:1,fromY:1,toX:1,toY:1,progress:1,dir:{x:0,y:0},nextDir:{x:0,y:0}});
  const gc=['#ff5555','#55aaff','#aa55ff'], gn=['중력','복사압','불안정'];
  ghosts=[]; const placed=[{x:1,y:1}];
  for(let i=0;i<ghostCount;i++){
    const s=findOpenSpot(placed); placed.push(s);
    ghosts.push({x:s.x,y:s.y,fromX:s.x,fromY:s.y,toX:s.x,toY:s.y,progress:1,
      color:gc[i%3],name:gn[i%3],dir:{x:i%2===0?1:-1,y:0},frameDiv:GHOST_MOVE_FRAMES_BASE+i*2});
  }
}
function stageDifficultyFactor(idx){return Math.max(6,GHOST_MOVE_FRAMES_BASE-idx);}
function startStage(idx){
  stageIndex=idx; temperature=0;
  const cfg=stageConfig[idx];
  loadMaze(generateVerifiedMaze(cfg.cellSize,cfg.cellSize));
  setupCanvasSize();
  resetPlayerAndGhosts(cfg.ghostCount);
  const diff=stageDifficultyFactor(idx);
  ghosts.forEach((g,i)=>g.frameDiv=diff+i*2);
  updateHUD();
  document.getElementById('stageInfo').textContent=
    `${STAGES[idx].name} 단계 - ${STAGES[idx].dotName}(${STAGES[idx].dotElement}) 원소를 ${Math.round(CLEAR_RATIO*100)}% 모으면 다음 단계로!`;
  document.getElementById('ghostCountInfo').textContent=
    `👻 현재 유령(불안정 요인) 개수: ${cfg.ghostCount}개`;
  if(idx===STAGES.length-1){
    const et=dots.filter(d=>!d.eaten);
    powerUpPos=et[Math.floor(et.length/2)];
    powerUpPos.eaten=false;
  } else powerUpPos=null;
}
function updateHUD(){
  document.getElementById('lives').textContent=lives;
  document.getElementById('score').textContent=score;
  document.getElementById('stageNum').textContent=stageIndex+1;
  const total=dots.length, eaten=dots.filter(d=>d.eaten).length;
  const pct=total>0?Math.min(100,(eaten/total)*100):0;
  temperature=pct;
  document.getElementById('tempBar').style.width=pct+'%';
  document.getElementById('tempLabel').textContent=STAGES[stageIndex].tempLabel;
  document.getElementById('dexList').innerHTML=
    collectedElements.length?collectedElements.map(e=>`<span class="dexBadge">${e}</span>`).join(''):'없음';
}
// ── 팝업 ──
function showStagePopup(stage,cb){
  gameRunning=false;
  document.getElementById('popupBox').classList.remove('capturePopup');
  document.getElementById('overlay').style.display='flex';
  document.getElementById('popupTitle').textContent=`🔥 ${stage.name} 단계 돌입!`;
  document.getElementById('popupText').textContent=stage.story;
  document.getElementById('quizOptions').innerHTML='';
  const btn=document.getElementById('popupBtn');
  btn.style.display='block'; btn.textContent='확인 (퀴즈 풀기)';
  btn.onclick=()=>{currentQuiz=pickRandomQuiz(stage);showQuiz(currentQuiz,cb);};
}
function showQuiz(quiz,cb){
  document.getElementById('popupTitle').textContent='🧠 미니 퀴즈';
  document.getElementById('popupText').textContent=quiz.q;
  const qd=document.getElementById('quizOptions'); qd.innerHTML='';
  document.getElementById('popupBtn').style.display='none';
  quiz.options.forEach((opt,i)=>{
    const b=document.createElement('button'); b.textContent=opt;
    b.onclick=()=>{
      if(i===quiz.answer){score+=QUIZ_CORRECT_BONUS;document.getElementById('popupTitle').textContent='✅ 정답입니다!';document.getElementById('popupText').textContent=`보너스 ${QUIZ_CORRECT_BONUS}점 획득! 다음 단계로 이동합니다.`;}
      else{document.getElementById('popupTitle').textContent='❌ 오답입니다';document.getElementById('popupText').textContent=`정답은 "${quiz.options[quiz.answer]}" 였습니다. 다음 단계로 이동합니다.`;}
      qd.innerHTML='';
      const fb=document.getElementById('popupBtn'); fb.style.display='block'; fb.textContent='계속하기';
      fb.onclick=()=>{document.getElementById('overlay').style.display='none';cb();};
    };
    qd.appendChild(b);
  });
}
function showEnding(){
  gameRunning=false; stopBGM();
  document.getElementById('popupBox').classList.remove('capturePopup');
  document.getElementById('overlay').style.display='flex';
  document.getElementById('popupTitle').textContent='🌟 별의 일생 완주!';
  document.getElementById('popupText').innerHTML=
    '축하합니다! 별의 탄생부터 초신성 폭발까지 전 과정을 완주했습니다.<br><br>'+
    '<b>수소 → 헬륨 → 탄소/산소 → 네온/마그네슘 → 철 → (초신성) → 금/우라늄</b><br><br>'+
    '지금 당신 몸속의 철분, 반지 속의 금 모두 이렇게 별에서 만들어졌습니다!<br><br>'+
    `최종 점수: ${score}점`;
  document.getElementById('quizOptions').innerHTML='';
  const btn=document.getElementById('popupBtn'); btn.style.display='block'; btn.textContent='다시 시작하기';
  btn.onclick=()=>{document.getElementById('overlay').style.display='none';document.getElementById('startBtn').style.display='inline-block';};
}
function showLifeLostPopup(cb){
  gameRunning=false; playCaptureSound();
  const stage=STAGES[stageIndex];
  document.getElementById('popupBox').classList.add('capturePopup');
  document.getElementById('overlay').style.display='flex';
  document.getElementById('popupTitle').textContent='💥 불안정한 반응 발생!';
  document.getElementById('popupText').innerHTML=
    `유령과 충돌하여 생명력이 감소했습니다.<br><br><b>현재 별의 상태 (${stage.name})</b><br>${stage.captureDesc}<br><br>`+
    `<b>현재 온도 도달 목표:</b> ${stage.tempLabel}<br><b>현재 점수:</b> ${score}점<br><b>남은 생명:</b> ${lives}개`;
  document.getElementById('quizOptions').innerHTML='';
  const btn=document.getElementById('popupBtn'); btn.style.display='block'; btn.textContent='계속하기';
  btn.onclick=()=>{document.getElementById('overlay').style.display='none';document.getElementById('popupBox').classList.remove('capturePopup');cb();};
}
function showGameOver(){
  gameRunning=false; stopBGM();
  const stage=STAGES[stageIndex];
  document.getElementById('popupBox').classList.add('capturePopup');
  document.getElementById('overlay').style.display='flex';
  document.getElementById('popupTitle').textContent='💀 게임 오버';
  document.getElementById('popupText').innerHTML=
    `핵융합이 중단되어 별이 붕괴했습니다.<br><br><b>마지막 별의 상태 (${stage.name})</b><br>${stage.captureDesc}<br><br><b>최종 점수:</b> ${score}점`;
  document.getElementById('quizOptions').innerHTML='';
  const btn=document.getElementById('popupBtn'); btn.style.display='block'; btn.textContent='다시 시작하기';
  btn.onclick=()=>{document.getElementById('overlay').style.display='none';document.getElementById('popupBox').classList.remove('capturePopup');document.getElementById('startBtn').style.display='inline-block';};
}
// ── 입력 ──
document.addEventListener('keydown',(e)=>{
  if(!gameRunning)return;
  if(e.key==='ArrowUp'){player.nextDir={x:0,y:-1};e.preventDefault();}
  else if(e.key==='ArrowDown'){player.nextDir={x:0,y:1};e.preventDefault();}
  else if(e.key==='ArrowLeft'){player.nextDir={x:-1,y:0};e.preventDefault();}
  else if(e.key==='ArrowRight'){player.nextDir={x:1,y:0};e.preventDefault();}
});
document.getElementById('startBtn').addEventListener('click',()=>{
  initAudio(); document.getElementById('startBtn').style.display='none'; resetGame();
});
function resetGame(){
  score=0; lives=3; collectedElements=[];
  startStage(0);
  showStagePopup(STAGES[0],()=>{gameRunning=true;lastTime=performance.now();startBGM();requestAnimationFrame(gameLoop);});
}
// ── 이동 헬퍼 ──
function tryStartMove(ent,dir,frames){
  if(!dir.x&&!dir.y)return false;
  let nx=ent.x+dir.x, ny=ent.y+dir.y;
  if(nx<0)nx=COLS-1; if(nx>=COLS)nx=0;
  if(ny<0||ny>=ROWS)return false;
  if(maze[ny][nx]===1)return false;
  ent.fromX=ent.x; ent.fromY=ent.y; ent.toX=nx; ent.toY=ny; ent.progress=0; ent.dir=dir;
  return true;
}
function stepEntity(ent,frames){
  if(ent.progress<1){
    ent.progress+=1/frames;
    if(ent.progress>=1){ent.progress=1;ent.x=ent.toX;ent.y=ent.toY;}
  }
}
function getPixelPos(ent){
  return{px:(ent.fromX+(ent.toX-ent.fromX)*ent.progress)*TILE,
         py:(ent.fromY+(ent.toY-ent.fromY)*ent.progress)*TILE};
}
// ── 게임 루프 ──
let lastTime=0;
function gameLoop(ts){if(!gameRunning)return;update();draw();requestAnimationFrame(gameLoop);}
function update(){
  if(player.progress>=1){
    let moved=false;
    if(player.nextDir.x||player.nextDir.y)moved=tryStartMove(player,player.nextDir,PLAYER_MOVE_FRAMES);
    if(!moved)tryStartMove(player,player.dir,PLAYER_MOVE_FRAMES);
  }
  stepEntity(player,PLAYER_MOVE_FRAMES);
  player.mouth+=0.2;
  const cx=player.progress>=1?player.x:(player.progress>0.5?player.toX:player.fromX);
  const cy=player.progress>=1?player.y:(player.progress>0.5?player.toY:player.fromY);
  dots.forEach(d=>{
    if(!d.eaten&&d.x===cx&&d.y===cy){
      d.eaten=true; score+=DOT_SCORE; playEatSound();
      const st=STAGES[stageIndex];
      if(!collectedElements.includes(st.dotElement))collectedElements.push(st.dotElement);
      updateHUD();
    }
  });
  if(powerUpPos&&!powerUpPos.eaten&&powerUpPos.x===cx&&powerUpPos.y===cy){
    powerUpPos.eaten=true; invincible=true; invincibleTimer=300; score+=POWERUP_SCORE; updateHUD();
  }
  if(invincible&&--invincibleTimer<=0)invincible=false;
  const total=dots.length, eaten=dots.filter(d=>d.eaten).length;
  if(eaten>=Math.ceil(total*CLEAR_RATIO)&&gameRunning){
    gameRunning=false; score+=STAGE_CLEAR_BONUS; playStageClearSound();
    if(stageIndex<STAGES.length-1){
      setTimeout(()=>{showStagePopup(STAGES[stageIndex+1],()=>{startStage(stageIndex+1);gameRunning=true;lastTime=performance.now();requestAnimationFrame(gameLoop);});},300);
    } else setTimeout(showEnding,300);
    return;
  }
  ghosts.forEach(g=>{
    if(g.progress>=1){
      const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      let valid=dirs.filter(d=>{
        let nx=g.x+d.x, ny=g.y+d.y;
        if(nx<0)nx=COLS-1; if(nx>=COLS)nx=0;
        if(ny<0||ny>=ROWS)return false;
        return maze[ny][nx]!==1;
      });
      let cands=valid.filter(d=>!(d.x===-g.dir.x&&d.y===-g.dir.y));
      if(!cands.length)cands=valid;
      if(cands.length){
        let chosen;
        if(Math.random()<0.5){
          let md=Infinity;
          cands.forEach(d=>{const dist=Math.abs(g.x+d.x-player.x)+Math.abs(g.y+d.y-player.y);if(dist<md){md=dist;chosen=d;}});
        } else chosen=cands[Math.floor(Math.random()*cands.length)];
        tryStartMove(g,chosen,g.frameDiv);
      }
    }
    stepEntity(g,g.frameDiv);
  });
  if(!invincible){
    const pp=getPixelPos(player);
    for(const g of ghosts){
      const gp=getPixelPos(g);
      if(Math.abs(gp.px-pp.px)<TILE*0.6&&Math.abs(gp.py-pp.py)<TILE*0.6){
        lives--; updateHUD();
        if(lives<=0){gameRunning=false;setTimeout(showGameOver,100);}
        else{
          gameRunning=false;
          setTimeout(()=>{showLifeLostPopup(()=>{
            const cfg=stageConfig[stageIndex];
            resetPlayerAndGhosts(cfg.ghostCount);
            const diff=stageDifficultyFactor(stageIndex);
            ghosts.forEach((g,i)=>g.frameDiv=diff+i*2);
            gameRunning=true; lastTime=performance.now(); requestAnimationFrame(gameLoop);
          });},100);
        }
        return;
      }
    }
  }
}
// ── 그리기 ──
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
    if(maze[r][c]===1){
      ctx.fillStyle='#1a1a4a'; ctx.fillRect(c*TILE,r*TILE,TILE,TILE);
      ctx.strokeStyle='#3355aa'; ctx.strokeRect(c*TILE,r*TILE,TILE,TILE);
    }
  }
  const stage=STAGES[stageIndex];
  dots.forEach(d=>{
    if(!d.eaten){ctx.beginPath();ctx.fillStyle=stage.dotColor;ctx.arc(d.x*TILE+TILE/2,d.y*TILE+TILE/2,4,0,Math.PI*2);ctx.fill();}
  });
  if(powerUpPos&&!powerUpPos.eaten){
    ctx.beginPath(); ctx.fillStyle='#ff00ff';
    ctx.arc(powerUpPos.x*TILE+TILE/2,powerUpPos.y*TILE+TILE/2,7+Math.sin(Date.now()/150)*3,0,Math.PI*2);
    ctx.fill();
  }
  const pp=getPixelPos(player);
  ctx.save(); ctx.translate(pp.px+TILE/2,pp.py+TILE/2);
  let angle=0;
  if(player.dir.x===1)angle=0;
  else if(player.dir.x===-1)angle=Math.PI;
  else if(player.dir.y===-1)angle=-Math.PI/2;
  else if(player.dir.y===1)angle=Math.PI/2;
  ctx.rotate(angle);
  const mo=Math.abs(Math.sin(player.mouth))*0.3+0.05;
  ctx.beginPath(); ctx.fillStyle=invincible?'#00ffff':'#ffdd00';
  ctx.arc(0,0,TILE/2-1,mo*Math.PI,(2-mo)*Math.PI); ctx.lineTo(0,0); ctx.fill();
  ctx.restore();
  ghosts.forEach(g=>{
    const gp=getPixelPos(g);
    ctx.fillStyle=invincible?'#3333ff':g.color; ctx.beginPath();
    ctx.arc(gp.px+TILE/2,gp.py+TILE/2-2,TILE/2-2,Math.PI,0);
    ctx.lineTo(gp.px+TILE-2,gp.py+TILE-2);
    for(let i=0;i<3;i++){
      ctx.lineTo(gp.px+TILE-2-(i+0.5)*(TILE-4)/3,gp.py+TILE-6);
      ctx.lineTo(gp.px+TILE-2-(i+1)*(TILE-4)/3,gp.py+TILE-2);
    }
    ctx.lineTo(gp.px+2,gp.py+TILE/2-2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath();
    ctx.arc(gp.px+TILE/2-4,gp.py+TILE/2-4,3,0,Math.PI*2);
    ctx.arc(gp.px+TILE/2+4,gp.py+TILE/2-4,3,0,Math.PI*2);
    ctx.fill();
  });
}
// 초기 렌더링
loadMaze(generateVerifiedMaze(7,7));
setupCanvasSize(); resetPlayerAndGhosts(1); draw();
</script>
